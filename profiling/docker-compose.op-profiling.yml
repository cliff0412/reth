name: op-reth-profiling

services:
 # Creates a genesis state for the beacon chain using a YAML configuration file and
  # a deterministic set of 64 validators.
  create-beacon-chain-genesis:
    image: "gcr.io/prysmaticlabs/prysm/cmd/prysmctl:HEAD-aec349"
    command:
      - testnet
      - generate-genesis
      - --fork=capella
      - --num-validators=64
      - --genesis-time-delay=15
      - --output-ssz=/consensus/genesis.ssz
      - --chain-config-file=/consensus/config.yml
      - --geth-genesis-json-in=/execution/genesis.json
      - --geth-genesis-json-out=/execution/genesis.json
    volumes:
      - ./test_data/consensus:/consensus
      - ./test_data/execution:/execution

  # Removes the database of the go-ethereum execution client to ensure we start from a clean state.
  # (geth has a `removedb` option, but it asks for a keyboard confirmation, so we use this instead)
  geth-remove-db:
    image: "alpine:3.19.0"
    command: rm -rf /execution/geth
    volumes:
      - ./test_data/execution:/execution

  # Sets up the genesis configuration for the go-ethereum client from a JSON file.
  geth-genesis:
    image: "ethereum/client-go:v1.14.5"
    command: --datadir=/execution --gcmode=archive init --state.scheme=hash /execution/genesis.json
    volumes:
      - ./test_data/execution:/execution
      - ./test_data/execution/genesis.json:/execution/genesis.json
    depends_on:
      create-beacon-chain-genesis:
        condition: service_completed_successfully
      geth-remove-db:
        condition: service_completed_successfully

  # Runs a Prysm beacon chain from a specified genesis state created in the previous step
  # and connects to go-ethereum in the same network as the execution client.
  # The account used in go-ethereum is set as the suggested fee recipient for transactions
  # proposed via the validators attached to the beacon node.
  beacon-chain:
    image: "gcr.io/prysmaticlabs/prysm/beacon-chain:v4.1.1"
    command:
      - --datadir=/consensus/beacondata
      # No peers to sync with in this testnet, so setting to 0
      - --min-sync-peers=0
      - --genesis-state=/consensus/genesis.ssz
      - --bootstrap-node=
      - --interop-eth1data-votes
      # The chain configuration file used for setting up Prysm
      - --chain-config-file=/consensus/config.yml
      # We specify the chain id used by our execution client
      - --contract-deployment-block=0
      - --chain-id=${CHAIN_ID:-32382}
      - --rpc-host=0.0.0.0
      - --grpc-gateway-host=0.0.0.0
      - --execution-endpoint=http://geth:8551
      - --accept-terms-of-use
      - --jwt-secret=/execution/jwtsecret
      - --suggested-fee-recipient=0x123463a4b065722e99115d6c222f267d9cabb524
      - --minimum-peers-per-subnet=0
      - --enable-debug-rpc-endpoints
      - --force-clear-db
    depends_on:
      create-beacon-chain-genesis:
        condition: service_completed_successfully
    ports:
      - 4000:4000
      - 3500:3500
      - 8080:8080
      - 6060:6060
      - 9090:9090
    volumes:
      - ./test_data/consensus:/consensus
      - ./test_data/execution:/execution
      - ./test_data/execution/jwtsecret:/execution/jwtsecret

  # Runs the go-ethereum execution client with the specified, unlocked account and necessary
  # APIs to allow for proof-of-stake consensus via Prysm.
  geth:
    image: "ethereum/client-go:v1.14.5"
    hostname: l1-geth
    command:
      - --http
      - --http.api=eth,net,web3,debug
      - --http.addr=0.0.0.0
      - --http.corsdomain=*
      - --http.vhosts=*
      - --ws
      - --ws.api=eth,net,web3
      - --ws.addr=0.0.0.0
      - --ws.origins=*
      - --authrpc.vhosts=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.jwtsecret=/execution/jwtsecret
      - --datadir=/execution
      - --allow-insecure-unlock
      - --unlock=0x123463a4b065722e99115d6c222f267d9cabb524
      - --password=/execution/geth_password.txt
      - --nodiscover
      - --syncmode=full
      - --gcmode=archive
    ports:
      - 8551:8551
      - 8545:8545
      - 8546:8546
    depends_on:
      geth-genesis:
        condition: service_completed_successfully
      beacon-chain:
        condition: service_started
    volumes:
      - ./test_data/execution:/execution
      - ./test_data/execution/jwtsecret:/execution/jwtsecret
      - ./test_data/execution/geth_password.txt:/execution/geth_password.txt
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8545"]
      interval: 10s                                           # How often to check
      timeout: 5s                                             # How long to wait for response
      retries: 5                                              # How many failures before "unhealthy"
      start_period: 30s                                       # Initial grace period

  # We run a validator client with 64, deterministically-generated keys that match
  # The validator keys present in the beacon chain genesis state generated a few steps above.
  validator:
    image: "gcr.io/prysmaticlabs/prysm/validator:v4.1.1"
    command:
      - --beacon-rpc-provider=beacon-chain:4000
      - --datadir=/consensus/validatordata
      - --accept-terms-of-use
      - --interop-num-validators=64
      - --interop-start-index=0
      - --chain-config-file=/consensus/config.yml
      - --force-clear-db
    depends_on:
      beacon-chain:
        condition: service_started
    volumes:
      - ./test_data/consensus:/consensus

  deploy_op:
    # image: deploy-op
    build:
      context: ./..
      dockerfile: ./profiling/DockerfileDeployOp
    volumes:
      - ./optimism_build:/app/optimism_build
      # - ./deploy-config:/app/deploy-config
    environment:
      - L1_RPC_URL=http://geth:8545
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    command: bash -c "/app/deploy-op.sh && echo 'Deployment completed, exit container'"
    depends_on:
      geth:
        condition: service_healthy

  op-reth:
    restart: unless-stopped
    privileged: true
    # image: op-reth-profiling
    build:
      context: ./..
      dockerfile: ./profiling/DockerfileOpProfile
      args:
        BUILD_PROFILE: profiling
        FEATURES: "jemalloc-prof,asm-keccak"
        RUSTFLAGS: "-C target-cpu=native"
    ports:
      - "9001:9001" # metrics
      - "30303:30303" # eth/66 peering
      - "7547:7547" # rpc
      - "8552:8552" # engine
      - "3000:3000" # pprof
    volumes:
      - ./op_reth_data:/root/.local/share/reth/data
      - ./optimism_build:/app/optimism/build
      - ./logs:/root/logs
      - ./profiles:/app/profiles
      - /tmp:/tmp
    environment:
      - ENABLE_PROFILING=true
      - MALLOC_CONF=prof:true,lg_prof_sample:0,lg_prof_interval:30,prof_prefix:/app/profiles/jeprof
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - INIT_DATABASE=true
    # Enable host PID namespace for better profiling
    pid: host
    # Add capabilities for profiling
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: >
      node
      --chain /app/optimism/build/genesis.json
      --datadir /root/.local/share/reth/data
      --full
      --http
      --http.addr 0.0.0.0
      --http.port 7547
      --http.api "web3,debug,eth,txpool,net"
      --http.corsdomain "*"
      --ws
      --ws.addr=0.0.0.0
      --ws.port=7546
      --ws.api "debug,eth,txpool,net"
      --ws.origins "*"
      --authrpc.addr 0.0.0.0
      --authrpc.port 8552
      --authrpc.jwtsecret /tmp/jwt.txt
      --txpool.pending-max-count 800000
      --txpool.pending-max-size 4096
      --txpool.queued-max-count 800000
      --txpool.queued-max-size 4096
      --txpool.max-account-slots 1024
      --metrics 0.0.0.0:9001
      --ipcpath /root/.local/share/reth/reth.ipc
      --log.file.directory /root/logs
    depends_on:
      deploy_op:
        condition: service_completed_successfully
  op-node:
    build:
      context: ./..
      dockerfile: ./profiling/DockerfileDeployOp
    depends_on:
      op-reth:
        condition: service_started
    volumes:
      - ./optimism_build:/app/optimism/build
      - /tmp:/tmp
    command: >
      /app/optimism/op-node/bin/op-node
      --l1=http://geth:8545
      --l1.beacon=http://beacon-chain:3500
      --l1.rpckind=standard
      --l2=http://op-reth:8552
      --l2.jwt-secret=/tmp/jwt.txt
      --sequencer.enabled
      --sequencer.l1-confs=5
      --verifier.l1-confs=4
      --rollup.config=/app/optimism/build/rollup.json
      --rpc.addr=0.0.0.0
      --p2p.disable
      --rpc.enable-admin
      --p2p.sequencer.key=0x8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba

